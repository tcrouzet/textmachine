<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="4270" viewBox="0 0 1000 4270" role="img" aria-labelledby="title description">
  <title id="title">TextMachine : de la veille à la newsletter</title>
  <desc id="description">Alertes Google, autres services d’alerte et envois directs arrivent dans Gmail. Les filtres configurés par l’utilisateur appliquent un libellé au choix, par exemple TextMachine, et archivent les messages sans les marquer comme lus. Dans Obsidian, l’utilisateur connecte Gmail, choisit ce libellé, un dossier et son IA, puis lance Text Machine. Le plugin extrait les liens, applique les exclusions, élimine les doublons et enregistre les sources avant de marquer les messages comme lus. Les flux RSS ou Atom complètent la collecte. Les textes déjà disponibles sont réutilisés ; les autres articles sont chargés. Les titres inaccessibles sont conservés pour En bref. Le plugin détermine les sources disponibles pour l’édition, exclut les publications des flux d’auteur et vérifie le minimum de dix articles avec texte, seuil réglable. Les prompts sélection.md, writer.md, bref.md, rewriter.md et publisher.md sélectionnent les sources, rédigent l’article, traduisent les titres En bref, révisent le corps du texte, puis produisent le titre et le chapeau. L’historique évite les répétitions et les réponses JSON sont validées. Une révision rejetée conserve le brouillon. Le prompt image.md crée une illustration, sauf si celle du jour existe déjà. Le plugin assemble le modèle Markdown, corrige la typographie française, enregistre la note et l’image, puis date l’utilisation de tous les articles disponibles. L’utilisateur relit, modifie et publie. Une relance régénère l’édition du jour ; les articles d’éditions supprimées redeviennent disponibles jusqu’à la dernière édition conservée.</desc>
